    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">

    <!-- Bootstrap Icons (for the shield and button icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* =========================================
           EMS 403 - FORBIDDEN ACCESS
           Layout and animation matched to the 401 page
        ========================================= */

        body {
            margin: 0;
            overflow: hidden;
        }

        .ems-error-page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 45%, rgba(13, 110, 253, 0.08), transparent 35%),
                radial-gradient(circle at 15% 80%, rgba(220, 53, 69, 0.06), transparent 30%);
        }

        /* Animated grid background */
        .ems-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
            background-size: 45px 45px;
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        /* Floating technical dots */
        .tech-dot {
            position: absolute;
            z-index: 1;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #0d6efd;
            opacity: 0.45;
            animation: dotFloat 6s ease-in-out infinite;
            pointer-events: none;
        }

        .dot-1 { top: 20%; left: 15%; }
        .dot-2 { top: 30%; right: 20%; animation-delay: 1s; }
        .dot-3 { bottom: 25%; left: 25%; animation-delay: 2s; }
        .dot-4 { bottom: 20%; right: 15%; animation-delay: 3s; }

        /* Main content */
        .ems-content {
            position: relative;
            z-index: 5;
            padding-top: 35px;
            padding-bottom: 35px;
            animation: contentReveal 0.9s ease-out;
        }

        /* EMS logo */
        .ems-logo {
            display: block;
            width: 190px;
            max-width: 48vw;
            max-height: 75px;
            object-fit: contain;
            margin: 0 auto 25px;
            animation: fadeUp 0.8s ease-out both;
        }

        /* Security visual */
        .security-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .security-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(13, 110, 253, 0.18);
            animation: ringPulse 3s ease-in-out infinite;
        }

        .security-ring::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 1px dashed rgba(13, 110, 253, 0.25);
            animation: rotateRing 14s linear infinite;
        }

        .scan-line {
            position: absolute;
            left: 20px;
            right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(13, 110, 253, 0.8), transparent);
            filter: blur(0.5px);
            animation: scan 2.5s ease-in-out infinite;
        }

        .security-shield {
            position: relative;
            width: 95px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(50% 0%, 91% 15%, 91% 55%, 82% 76%, 50% 100%, 18% 76%, 9% 55%, 9% 15%);
            background: linear-gradient(145deg, #0d6efd, #084298);
            box-shadow: 0 20px 50px rgba(13, 110, 253, 0.25);
            animation: shieldFloat 3s ease-in-out infinite;
        }

        .security-shield i {
            font-size: 2.8rem;
            color: #fff;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.2));
        }

        /* System status */
        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            margin-bottom: 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(220, 53, 69, 0.08);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.15);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            flex: 0 0 7px;
            border-radius: 50%;
            background: #dc3545;
            box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4);
            animation: statusPulse 2s infinite;
        }

        /* Error code */
        .error-code {
            font-size: clamp(5rem, 13vw, 9rem);
            line-height: 0.85;
            font-weight: 900;
            letter-spacing: -8px;
            color: transparent;
            -webkit-text-stroke: 2px rgba(13, 110, 253, 0.25);
            background: linear-gradient(180deg, #0d6efd, #084298);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 15px 40px rgba(13, 110, 253, 0.15);
            animation: codeReveal 1s ease-out;
        }

        .error-title {
            font-weight: 700;
            letter-spacing: -0.5px;
            animation: fadeUp 0.8s ease-out 0.15s both;
        }

        .error-description {
            max-width: 530px;
            margin: 0 auto;
            line-height: 1.7;
            animation: fadeUp 0.8s ease-out 0.3s both;
        }

        /* Buttons */
        .ems-actions {
            flex-wrap: wrap;
        }

        .ems-btn {
            padding: 11px 22px;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .ems-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(13, 110, 253, 0.18);
        }

        .ems-footer {
            animation: fadeUp 0.8s ease-out 0.4s both;
        }

        /* Animations */
        @keyframes contentReveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes codeReveal {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 45px 45px; }
        }

        @keyframes dotFloat {
            0%, 100% { transform: translateY(0); opacity: 0.35; }
            50% { transform: translateY(-18px); opacity: 0.8; }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.75; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes scan {
            0%, 100% { top: 25px; opacity: 0.2; }
            50% { top: 145px; opacity: 1; }
        }

        @keyframes shieldFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        @keyframes statusPulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 7px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        @media (max-width: 576px) {
            body { overflow: auto; }

            .ems-content {
                padding-top: 25px;
                padding-bottom: 25px;
            }

            .ems-logo {
                width: 155px;
                max-height: 62px;
                margin-bottom: 20px;
            }

            .security-wrapper {
                width: 150px;
                height: 150px;
                margin-bottom: 22px;
            }

            .security-shield {
                width: 80px;
                height: 94px;
            }

            .security-shield i { font-size: 2.3rem; }

            .error-code { letter-spacing: -5px; }

            .ems-actions {
                flex-direction: column;
                align-items: stretch;
                max-width: 260px;
                margin-left: auto;
                margin-right: auto;
            }

            .ems-btn { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="ems-error-page">
        <!-- Animated grid -->
        <div class="ems-grid" aria-hidden="true"></div>

        <!-- Floating technical dots -->
        <span class="tech-dot dot-1" aria-hidden="true"></span>
        <span class="tech-dot dot-2" aria-hidden="true"></span>
        <span class="tech-dot dot-3" aria-hidden="true"></span>
        <span class="tech-dot dot-4" aria-hidden="true"></span>

        <div class="container min-vh-100 d-flex align-items-center">
            <div class="row justify-content-center w-100">
                <div class="col-12 col-md-9 col-lg-7">
                    <main class="ems-content text-center">

                        <!-- EMS logo: place EMS-LOGO.png inside assets/images/ -->
                        <img
                            src="assets/images/EMS-LOGO.png"
                            alt="EMS - Equipment Management System"
                            class="ems-logo"
                            onerror="this.style.display='none';"
                        >

                        <!-- Security visual -->
                        <div class="security-wrapper" aria-hidden="true">
                            <div class="security-ring"></div>
                            <div class="scan-line"></div>
                            <div class="security-shield">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                        </div>

                        <!-- System status -->
                        <div class="system-status">
                            <span class="status-dot"></span>

                        </div>

                        <!-- Error code -->
                        <div class="error-code">403</div>

                        <!-- Title -->
                        <h3 class="error-title mt-4">Forbidden Access</h3>

                        <!-- Description -->
                        <p class="error-description text-body-secondary mt-3 mb-4">
                            You do not have permission to access this resource.
                            If you believe this is a mistake, please contact your system administrator.
                        </p>

                        <!-- Actions -->
                        <div class="ems-actions d-flex justify-content-center gap-2">
                            <a href="authentication/login.php" class="btn btn-primary ems-btn">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Login Again
                            </a>

                            <button
                                type="button"
                                class="btn btn-outline-secondary ems-btn"
                                onclick="if (history.length > 1) { history.back(); } else { window.location.href = 'authentication/login.php'; }"
                            >
                                <i class="bi bi-arrow-left me-2"></i>
                                Go Back
                            </button>
                        </div>

                        <!-- Footer status -->
                        <div class="small text-body-secondary mt-4 ems-footer">
                            <i class="bi bi-shield-check me-1"></i>
                            Equipment Management System
                        </div>

                    </main>
                </div>
            </div>
        </div>
    </div>

    <!-- CoreUI -->
    <script src="vendors/@coreui/coreui/js/coreui.bundle.min.js"></script>
